---
name: wc-test
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
jobs:
  test:
    needs: [gomodule]
    uses: suzuki-shunsuke/go-test-workflow/.github/workflows/test.yaml@ff8934b3958ec0c1b0a6fce445052e2d2a42e8c9 # v3.2.4
    with:
      aqua_version: v2.66.0
      golangci-lint-timeout: 120s
      gomodule_artifact_name: gomodule
      go-version-file: go.mod
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      pull-requests: write
      contents: read
      id-token: write

  # Download Go modules once and share them with integration-test and test
  gomodule:
    uses: suzuki-shunsuke/download-go-module-action/.github/workflows/download.yaml@e03acd0c9d3d230019ebb7bd4a62507431fe4316 # v0.0.10
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.66.0
      aqua_packages: go-licenses # go-test-workflow requires go-licenses
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  integration-test:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    needs: [gomodule]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: suzuki-shunsuke/download-go-module-action/restore@v0.0.10

      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0
      - run: go install ./cmd/tfmv
      - run: tfmv --version
      - run: tfmv --help

      - run: bash test/test.sh

  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.66.0
    permissions:
      contents: read
      pull-requests: read
